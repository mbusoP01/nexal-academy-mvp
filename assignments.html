<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignments | Nexal Pathway</title><link rel="icon" href="assets/brand/favicon.svg"><style>body{font-family:Inter,Arial,sans-serif;background:#f8f7f3;color:#243b53;margin:0}.wrap{max-width:900px;margin:auto;padding:2rem 1.25rem}.top{display:flex;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #ebe8df;background:#fff}.brand{font-family:Georgia,serif;font-weight:900;color:#102a43}.card{background:#fff;border:1px solid #e5e1d8;border-radius:1rem;padding:1.25rem;margin:1rem 0}.muted{color:#52606d;line-height:1.55}a{color:#2e8b57;font-weight:700}</style></head><body><header class="top"><a class="brand" href="dashboard.html">Nexal Pathway</a><a href="dashboard.html">← Home</a></header><main class="wrap"><p style="color:#2e8b57;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem">Coursework</p><h1>Assignments</h1><p class="muted">Work assigned to your current classes appears here. No fake deadlines or sample tasks are shown.</p><section id="items"><p class="muted">Loading assignments…</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth-guard.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const box=document.getElementById('items');try{const {data,error}=await window.supabaseClient.from('assignments').select('id,title,instructions,subject,unit_id,due_at,published,classes(name,grade)').eq('published',true).order('due_at',{ascending:true});if(error||!data?.length){box.innerHTML='<div class="card"><p class="muted">No assignments due.</p></div>';return;}box.replaceChildren();data.forEach(a=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=a.title;const p=document.createElement('p');p.className='muted';p.textContent=`${a.classes?.name||'Class'} · Grade ${a.classes?.grade||'—'} · ${a.subject} · ${a.unit_id}`;const body=document.createElement('p');body.className='muted';body.textContent=a.instructions||'Open the linked lesson to begin.';const due=document.createElement('p');due.className='muted';due.textContent=a.due_at?`Due ${new Date(a.due_at).toLocaleString()}`:'No due date';card.append(h,p,body,due);box.append(card);});}catch(e){box.innerHTML='<div class="card"><p class="muted">Assignments are temporarily unavailable.</p></div>';console.warn('[Nexal] assignments',e.message);}});</script></body></html>
