<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Completing sign in | Nexal Pathway</title><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/runtime-fallback.js"></script><script src="js/supabase-config.js"></script></head>
<body style="font-family:Inter,Arial,sans-serif;background:#fdfbf7;color:#002147;display:grid;place-items:center;min-height:100vh"><main aria-live="polite" style="text-align:center;padding:2rem"><h1>Completing sign in…</h1><p id="callback-status">Confirming your secure session.</p><p><a href="login.html">Return to Login</a></p></main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const status = document.getElementById('callback-status');
  const appBase = window.location.pathname.replace(/auth-callback\.html$/, '');
  const defaultNext = `${appBase}dashboard.html`;

  function safeReturnPath(value) {
    if (!value) return defaultNext;
    try {
      const candidate = new URL(value, window.location.origin);
      if (candidate.origin !== window.location.origin) return defaultNext;
      if (!candidate.pathname.startsWith(appBase)) return defaultNext;
      return `${candidate.pathname}${candidate.search}${candidate.hash}`;
    } catch (_) {
      return defaultNext;
    }
  }

  try {
    if (!window.supabaseClient) throw new Error('Authentication service is unavailable.');
    const { data: { session }, error } = await Promise.race([
      window.supabaseClient.auth.getSession(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('Authentication timed out.')), 7000))
    ]);
    if (error || !session) throw error || new Error('No session was returned by Google.');
    const next = safeReturnPath(sessionStorage.getItem('nexal-auth-next'));
    sessionStorage.removeItem('nexal-auth-next');
    window.location.replace(next);
  } catch (error) {
    status.textContent = `${error.message || 'Sign-in could not be completed.'} Try again or return to Login.`;
  }
});
</script></body></html>
