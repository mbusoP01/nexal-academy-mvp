<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexal Academy | Advanced Sciences & Mathematics</title>
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { oxford: '#002147', slate: '#475569', ivory: '#FDFBF7', emerald: '#2E8B57' }, fontFamily: { serif: ['Merriweather', 'serif'], sans: ['Inter', 'sans-serif'] } } } }</script>
    <style>body { background-color: #FDFBF7; background-image: linear-gradient(to right, rgba(71, 85, 105, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(71, 85, 105, 0.05) 1px, transparent 1px); background-size: 40px 40px; overflow-x: hidden; } @media (max-width: 640px) { main { max-width: 100vw; overflow: hidden; } main h1, main p { max-width: 100%; } main h1 { font-size: 2.5rem; } }
</head>
<body class="font-sans text-slate antialiased min-h-screen flex flex-col">
    <nav class="w-full py-4 md:py-6 px-4 md:px-8 flex flex-wrap gap-4 justify-between items-center bg-ivory/90 backdrop-blur-sm border-b border-slate/10 sticky top-0 z-50">
        <div class="flex items-center gap-3"><img src="assets/brand/nexal-pathway-mark.svg" alt="" class="w-10 h-10" aria-hidden="true"><div class="flex flex-col"><span class="text-xs font-bold tracking-widest text-slate uppercase">Learn with direction</span><a href="index.html" class="text-2xl font-serif font-black text-oxford">Nexal Pathway.</a></div></div>
        <div class="flex items-center gap-4 md:gap-8 flex-wrap justify-end text-sm md:text-base">
            <a href="index.html" class="text-oxford font-medium border-b-2 border-emerald">Home</a>
            <a href="about.html" class="text-slate hover:text-oxford transition-colors">About</a>
            <a href="contact.html" class="text-slate hover:text-oxford transition-colors">Contact</a>
            <a href="pricing.html" class="text-slate hover:text-oxford transition-colors">Plans</a>
            <a href="login.html" class="px-6 py-2 bg-white border border-slate/20 rounded-full text-oxford font-medium shadow-sm hover:shadow-md transition-all">Login</a>
        </div>
    </nav>
    <main class="flex-grow flex flex-col justify-center items-center text-center px-4 py-20">
        <span class="px-4 py-1 bg-emerald/10 text-emerald text-sm font-semibold tracking-wide rounded-full mb-8">GRADE 11 & 12 • GLOBAL STANDARD</span>
        <h1 class="w-full font-serif text-4xl sm:text-5xl md:text-7xl font-black text-oxford max-w-4xl leading-tight mb-6 break-words">A clear pathway to mathematical and scientific mastery.</h1>
        <p class="w-full text-lg md:text-xl text-slate max-w-2xl mb-12 leading-relaxed">A structured digital learning environment for South African secondary learners building confidence in Mathematics, Physical Sciences and Life Sciences.</p>
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
            <a href="login.html" class="px-8 py-4 bg-emerald text-white rounded-lg font-medium shadow-lg hover:bg-emerald/90 transition-all transform hover:-translate-y-0.5">Start Learning</a>
            <a href="about.html" class="px-8 py-4 bg-white text-oxford border border-slate/20 rounded-lg font-medium shadow-sm hover:bg-slate/5 transition-all">Globally Benchmarked Syllabus</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <script src="js/supabase-config.js"></script>
    <script src="js/brand.js"></script>
    
    <script>
        // Check if the user is already logged in. 
        // If they are, skip the landing page and take them straight to their dashboard.
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.supabaseClient) {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (session) {
                    window.location.replace('dashboard.html');
                }
            }
        });
    </script>
</body>
</html>
