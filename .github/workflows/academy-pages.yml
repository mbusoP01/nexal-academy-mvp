name: Academy Pages

on:
  push:
    branches:
      - 'chatgpt/project1-quality-gates-20260822'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: academy-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Academy before publish
        run: npm run project1:verify

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static Academy
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Academy
        id: deployment
        uses: actions/deploy-pages@v4
