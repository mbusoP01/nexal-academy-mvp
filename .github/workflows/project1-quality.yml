name: Project 1 Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'chatgpt/project1-*'

concurrency:
  group: project1-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Project 1
        run: npm run project1:verify

      - name: Print completion status
        if: always()
        run: npm run project1:status || true
