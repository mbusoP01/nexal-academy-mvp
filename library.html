                <span>Dashboard</span>
            </a>
            <a href="library.html" class="flex items-center space-x-3 p-3 rounded-xl bg-white text-oxford font-medium shadow-sm transition-all">

                <span>Course Library</span>
            </a>

            <p class="text-xs font-bold tracking-widest uppercase text-white/40 mb-4 mt-8 ml-2">The Arena</p>
            <a href="leaderboard.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/10 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                <span>Leaderboard</span>
            </a>
            <a href="challenges.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/10 transition-all">

        <div class="p-6 border-t border-white/10 bg-black/10">

                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>

    <header class="md:hidden w-full bg-oxford text-white p-4 flex justify-between items-center absolute top-0 z-30 shadow-md">
        <span class="font-serif font-black tracking-tight">Nexal Academy.</span>
        <div class="space-x-4 text-sm font-medium"><a href="dashboard.html">Dashboard</a><a href="settings.html">Settings</a></div>
    </header>

    <main class="flex-1 h-full overflow-y-auto p-6 pt-24 md:pt-10 md:p-12 relative z-10">
        <div class="max-w-6xl mx-auto">
            
            <header class="mb-12">
                <h1 class="text-4xl font-serif font-black text-oxford">CAPS Learning Library</h1>
                <p class="text-slate mt-2 text-lg">Find a structured lesson by subject, chapter or topic.</p>
                <label class="block mt-6 max-w-xl"><span class="sr-only">Search lessons</span><input id="library-search" type="search" placeholder="Search quadratic, Newton, DNA…" class="w-full rounded-xl border border-slate/20 bg-white px-4 py-3 text-oxford shadow-sm outline-none focus:border-emerald" /></label>
            </header>

            <div id="full-library-container" class="space-y-12">
                <div class="text-center py-12">
                    <div class="w-8 h-8 border-4 border-emerald border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-slate font-medium">Downloading academic matrix...</p>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/access-manifest.js"></script>
    <script src="js/entitlements.js"></script>
    <script src="js/brand.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/curriculum.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) return;

            const { data: profile } = await window.supabaseClient.from('profiles').select('is_admin').eq('id', user.id).single();
            if (profile && profile.is_admin) {
                document.getElementById('admin-link-container').innerHTML = `
                    <p class="text-xs font-bold tracking-widest uppercase text-red-500 mb-4 mt-8 ml-2">Classified Access</p>
                    <a href="admin-hub.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-red-500/10 text-red-600 font-bold transition-all shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <span>System Overlord</span>
                    </a>
                `;
            }

            const container = document.getElementById('full-library-container');
            container.innerHTML = ''; 

            if (!window.NEXAL_CURRICULUM) {
                container.innerHTML = `<p class="text-red-500 font-bold">Error: Curriculum Matrix Offline. Check network.</p>`;
                return;
            }

            // Loop through all subjects in the curriculum
            Object.keys(window.NEXAL_CURRICULUM).forEach(subjectId => {
                const subject = window.NEXAL_CURRICULUM[subjectId];
                
                const section = document.createElement('section');
                section.className = "bg-white rounded-3xl p-8 border border-slate/10 shadow-sm";
                
                let modulesHTML = '';
                subject.syllabus.forEach(chapter => {
                    chapter.modules.forEach(mod => {
                        // THE FIX: Route specifically to study-hall.html
                        modulesHTML += `
                            <div data-lesson-card role="link" tabindex="0" onclick="window.location.href='study-hall.html?subject=${subjectId}&module=${mod.id}&name=${encodeURIComponent(mod.name)}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" class="group p-5 rounded-2xl border-2 border-slate/10 hover:border-${subject.color || 'emerald'} hover:bg-${subject.color || 'emerald'}/5 transition-all cursor-pointer shadow-sm hover:shadow-md flex items-center justify-between bg-white">
                                <div>
                                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate/50 mb-1 block">${chapter.title}</span>
                                    <h4 class="font-bold text-oxford text-lg group-hover:text-${subject.color || 'emerald'} transition-colors">${mod.name}</h4>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-slate/5 flex items-center justify-center group-hover:bg-${subject.color || 'emerald'}/10 transition-colors">
                                    <svg class="w-5 h-5 text-slate/40 group-hover:text-${subject.color || 'emerald'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </div>
                            </div>
                        `;
                    });
                });

                section.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 border-b border-slate/10 pb-6 gap-4">
                        <div class="flex items-center space-x-4">
                            <span class="px-3 py-1 bg-${subject.color || 'emerald'}/10 text-${subject.color || 'emerald'} text-xs font-black tracking-widest rounded-full uppercase">${subject.badge || 'Core'}</span>
                            <h3 class="text-2xl font-serif font-black text-oxford">${subject.title}</h3>
                        </div>
                        <p class="text-sm text-slate md:w-1/2">${subject.description}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${modulesHTML}
                    </div>
                `;
                container.appendChild(section);
            });

            const search = document.getElementById('library-search');
            search.addEventListener('input', () => {
                const query = search.value.trim().toLowerCase();
                document.querySelectorAll('#full-library-container section').forEach(section => {
                    let visible = 0;
                    section.querySelectorAll('[data-lesson-card]').forEach(card => {
                        const matches = !query || card.textContent.toLowerCase().includes(query);
                        card.classList.toggle('hidden', !matches);
                        if (matches) visible += 1;
                    });
                    section.classList.toggle('hidden', visible === 0);
                });
            });
        });
    </script>
</body>
</html>
