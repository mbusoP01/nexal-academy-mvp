<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Courses | Nexal Pathway</title><link rel="icon" href="assets/brand/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#102a43',ink2:'#243b53',mint:'#2e8b57',paper:'#f8f7f3',sand:'#ebe8df'}}}}</script><style>body{background:#f8f7f3;color:#243b53;font-family:Inter,Arial,sans-serif}.serif{font-family:Merriweather,Georgia,serif}.card{background:#fff;border:1px solid #e5e1d8;border-radius:1.1rem;box-shadow:0 10px 24px rgba(16,42,67,.05)}.nav-link{color:#52606d;font-weight:600;font-size:.9rem}.nav-link:hover,.nav-link.active{color:#102a43}</style></head><body class="min-h-screen"><header class="sticky top-0 z-40 border-b border-sand bg-paper/95 backdrop-blur"><div class="mx-auto flex max-w-7xl items-center justify-between gap-5 px-5 py-4 lg:px-8"><a href="dashboard.html" class="flex items-center gap-3"><img src="assets/brand/nexal-pathway-mark.svg" alt="" class="h-10 w-10"><span><span class="block text-[10px] font-bold uppercase tracking-[.2em] text-mint">by Nexal</span><span class="serif text-xl font-black text-ink">Nexal Pathway</span></span></a><nav class="hidden items-center gap-7 md:flex" aria-label="Primary"><a class="nav-link" href="dashboard.html">Home</a><a class="nav-link active" href="library.html">My Courses</a><a class="nav-link" href="arena.html">Practice</a><a class="nav-link" href="revision.html">Revision</a><a class="nav-link" href="announcements.html">Announcements</a><a class="nav-link" href="settings.html">Profile</a></nav><button id="mobile-menu" type="button" class="rounded-lg border border-sand px-3 py-2 text-sm font-bold md:hidden">Menu</button></div><nav id="mobile-nav" class="hidden border-t border-sand bg-white px-5 py-4 md:hidden"><div class="grid grid-cols-2 gap-3"><a class="nav-link" href="dashboard.html">Home</a><a class="nav-link" href="library.html">My Courses</a><a class="nav-link" href="arena.html">Practice</a><a class="nav-link" href="revision.html">Revision</a><a class="nav-link" href="announcements.html">Announcements</a><a class="nav-link" href="settings.html">Profile</a></div></nav></header><main class="mx-auto max-w-7xl px-5 py-9 lg:px-8"><section class="mb-8 flex flex-col justify-between gap-5 md:flex-row md:items-end"><div><p class="text-sm font-semibold text-mint">My learning programme</p><h1 class="serif mt-2 text-3xl font-black text-ink md:text-4xl" id="heading">My Courses</h1><p class="mt-2 max-w-2xl text-[15px] leading-6 text-ink2" id="subheading">Your current-grade units, grouped by subject and term.</p></div><span id="scope-badge" class="rounded-full bg-white px-4 py-2 text-sm font-bold text-ink shadow-sm">Grade —</span></section><section class="card mb-8 grid gap-4 p-5 md:grid-cols-[1fr_180px_220px]"><label><span class="mb-2 block text-xs font-bold uppercase tracking-wider text-ink2">Search courses</span><input id="search" type="search" placeholder="Try quadratic, Newton, DNA…" class="w-full rounded-xl border border-sand bg-paper px-4 py-3 text-sm outline-none focus:border-mint"></label><label><span class="mb-2 block text-xs font-bold uppercase tracking-wider text-ink2">Grade scope</span><select id="grade" class="w-full rounded-xl border border-sand bg-paper px-4 py-3 text-sm"><option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select></label><label><span class="mb-2 block text-xs font-bold uppercase tracking-wider text-ink2">Subject</span><select id="subject" class="w-full rounded-xl border border-sand bg-paper px-4 py-3 text-sm"><option value="all">All subjects</option><option value="mathematics">Mathematics</option><option value="physical-sciences">Physical Sciences</option><option value="life-sciences">Life Sciences</option></select></label></section><div class="mb-5 flex items-center justify-between"><p class="text-sm font-semibold text-ink2"><span id="count">18</span> units in this programme</p><div class="flex gap-2 text-xs font-bold"><span class="rounded-full bg-mint/10 px-3 py-1 text-mint">Free preview</span><span class="rounded-full bg-ink/10 px-3 py-1 text-ink">Premium</span></div></div><section id="units" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/runtime-fallback.js"></script><script src="js/supabase-config.js"></script><script src="js/access-manifest.js"></script><script src="js/entitlements.js"></script><script src="js/brand.js"></script><script src="js/auth-guard.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let profile={grade:11,role:'learner'},entitlement={isPremium:false},units=[];async function getProfile(){const q=new URLSearchParams(location.search);if(location.hostname==='localhost'&&q.has('fixture'))return {grade:Number(q.get('grade')||11),role:q.get('role')||'learner'};const {data:{user}}=await window.supabaseClient.auth.getUser();const {data}=await window.supabaseClient.from('profiles').select('grade,role').eq('id',user.id).single();return data||profile;}async function getUnits(){const [m,i]=await Promise.all([fetch('content/caps-master-manifest.json').then(r=>r.json()),fetch('content/unit-index.json').then(r=>r.json())]);return m.units.map(u=>({...u,access:i.units?.[u.id]?.access||'free_preview'}));}function draw(){const grade=document.getElementById('grade').value,subject=document.getElementById('subject').value,q=document.getElementById('search').value.toLowerCase();const rows=units.filter(u=>(profile.role!=='learner'||String(u.grade)===String(profile.grade))&&String(u.grade)===grade&&(subject==='all'||u.subject===subject)&&(!q||`${u.topic} ${u.module} ${u.subject}`.toLowerCase().includes(q)));document.getElementById('count').textContent=rows.length;const labels={mathematics:'Mathematics','physical-sciences':'Physical Sciences','life-sciences':'Life Sciences'},colors={mathematics:'#2e8b57','physical-sciences':'#3f6f8f','life-sciences':'#8a6a3b'};document.getElementById('units').innerHTML=rows.map(u=>{const available=entitlement.isPremium||u.access==='free_full';return `<article class="card p-5"><div class="flex items-start justify-between gap-3"><span class="h-9 w-9 rounded-lg" style="background:${colors[u.subject]}"></span><span class="rounded-full ${available?'bg-mint/10 text-mint':'bg-ink/10 text-ink'} px-2 py-1 text-[10px] font-bold uppercase tracking-wider">${available?(entitlement.isPremium?'Full access':'Free showcase'):'Premium'}</span></div><p class="mt-4 text-xs font-bold uppercase tracking-wider text-ink2">Grade ${u.grade} · Term ${u.term} · ${labels[u.subject]}</p><h2 class="serif mt-2 text-lg font-black text-ink">${esc(u.topic)}</h2><p class="mt-1 text-sm text-ink2">${esc(u.module)}</p><a href="study-hall.html?unit=${encodeURIComponent(u.id)}" class="mt-5 inline-flex text-sm font-bold text-mint">${available?'Open lesson':'View preview'} →</a></article>`}).join('')||'<div class="card col-span-full p-10 text-center"><p class="font-bold text-ink">No units match this course filter.</p></div>';}document.addEventListener('DOMContentLoaded',async()=>{document.getElementById('mobile-menu').onclick=()=>document.getElementById('mobile-nav').classList.toggle('hidden');try{profile=await getProfile();await (window.NEXAL_ENTITLEMENT_READY||Promise.resolve(window.NEXAL_ENTITLEMENT));entitlement=window.NEXAL_ENTITLEMENT||entitlement;const grade=String(profile.grade||11);document.getElementById('grade').value=grade;document.getElementById('scope-badge').textContent=`Grade ${grade}${grade==='12'?' · Matric':''}`;document.getElementById('heading').textContent=`Grade ${grade} courses`;units=await getUnits();['search','grade','subject'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',draw));if(profile.role==='learner')document.getElementById('grade').disabled=true;draw();}catch(error){document.getElementById('units').innerHTML=`<div class="card col-span-full p-10 text-center"><p class="font-bold text-ink">Courses are temporarily unavailable.</p><p class="mt-2 text-sm text-ink2">${esc(error.message)}</p></div>`;}});
</script></body></html>
