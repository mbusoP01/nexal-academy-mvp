    <header class="md:hidden w-full bg-oxford text-white p-4 flex justify-between items-center absolute top-0 z-30">
        <span class="font-serif font-black">Nexal Academy.</span>
        <div class="space-x-4 text-sm"><a href="dashboard.html">Hub</a><a href="library.html">Library</a><a href="settings.html">Menu</a></div>
    </header>

    <main class="flex-1 h-full overflow-y-auto p-8 pt-20 md:pt-12 md:p-16 relative">
        <div class="max-w-6xl mx-auto">
            <header class="mb-12">
                <span class="px-4 py-1 bg-oxford/5 text-oxford text-xs font-bold tracking-widest rounded-full uppercase">Global Curriculum Directory</span>
                <h1 class="text-4xl font-serif font-bold text-oxford mt-6">Available Subjects</h1>
                <p class="text-slate mt-3 text-lg">Integrate international standard modules into your dashboard.</p>
            </header>
            <div id="library-modules" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div id="library-loading" class="col-span-full text-center py-20 text-slate animate-pulse">Accessing central database...</div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/curriculum.js"></script>
    <script>
        async function initializeCatalog() {
            const catalogContainer = document.getElementById('library-modules');
            try {
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                const { data: enrollments } = await window.supabaseClient.from('user_enrollments').select('subject_id').eq('user_id', user.id);
                const enrolledIds = enrollments.map(e => e.subject_id.toString());
                
                document.getElementById('library-loading').classList.add('hidden');

                Object.values(NEXAL_CURRICULUM).forEach(subject => {
                    const isEnrolled = enrolledIds.includes(subject.id.toString());
                    catalogContainer.innerHTML += `
                        <div class="bg-white p-8 rounded-2xl border border-slate/10 shadow-lg flex flex-col justify-between h-72 transition-all hover:-translate-y-1 hover:shadow-xl">
                            <div>
                                <span class="text-[10px] font-bold tracking-widest text-${subject.color} uppercase mb-3 block border-b border-slate/5 pb-2">${subject.badge}</span>
                                <h3 class="text-2xl font-serif font-bold text-oxford leading-tight">${subject.title}</h3>
                                <p class="text-slate text-sm mt-3 line-clamp-3 leading-relaxed">${subject.description}</p>
                            </div>
                            <button id="btn-${subject.id}" onclick="executeEnrollment(${subject.id})" ${isEnrolled ? 'disabled' : ''} class="w-full mt-6 py-3 rounded-xl font-bold tracking-wide text-center transition-all ${isEnrolled ? 'bg-slate/10 text-slate/40 cursor-not-allowed border border-slate/20' : 'bg-oxford text-white hover:bg-oxford/90 shadow-md'}">
                                ${isEnrolled ? 'Integrated ✓' : 'Add to Dashboard +'}
                            </button>
                        </div>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        async function executeEnrollment(subjectId) {
            const button = document.getElementById(`btn-${subjectId}`);
            button.disabled = true; button.innerText = "Syncing...";
            try {
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                await window.supabaseClient.from('user_enrollments').insert([{ user_id: user.id, subject_id: subjectId }]);
                button.innerText = "Success ✓";
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
            } catch (err) { alert("Enrollment failed."); button.disabled = false; button.innerText = "Add to Dashboard +"; }
        }
        document.addEventListener('DOMContentLoaded', initializeCatalog);
    </script>
</body>
</html>
