<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | Nexal Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

<body class="font-sans text-slate antialiased h-screen flex overflow-hidden">

    <aside class="w-64 bg-oxford text-white/80 flex flex-col h-full shadow-2xl z-20 hidden md:flex">
        <div class="p-8 border-b border-white/10">
            <span class="text-[10px] font-bold tracking-widest uppercase text-emerald">Global Standard</span>
            <h2 class="text-2xl font-serif font-black text-white mt-1 tracking-tight">Nexal Academy.</h2>
        </div>
        
        <nav class="flex-1 p-6 space-y-3 overflow-y-auto">
            <p class="text-xs font-bold tracking-widest uppercase text-white/40 mb-4 ml-2">Learning Hub</p>
            <a href="dashboard.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/10 text-white/70 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="library.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/10 text-white/70 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span>Course Library</span>
            </a>

            <p class="text-xs font-bold tracking-widest uppercase text-white/40 mb-4 mt-8 ml-2">The Arena</p>
            <a href="leaderboard.html" class="flex items-center space-x-3 p-3 rounded-xl bg-white text-oxford font-medium shadow-sm transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                <span>Leaderboard</span>
            </a>
            <a href="challenges.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/10 text-white/70 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span>Active Challenges</span>
            </a>
        </nav>

        <div class="p-6 border-t border-white/10 bg-black/10">
            <a href="settings.html" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/10 text-white/70 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Settings</span>
            </a>
        </div>
    </aside>

    <header class="md:hidden w-full bg-oxford text-white p-4 flex justify-between items-center absolute top-0 z-30">
        <span class="font-serif font-black">Nexal Academy.</span>
        <div class="space-x-4 text-sm"><a href="dashboard.html">Hub</a><a href="settings.html">Menu</a></div>
    </header>

    <main class="flex-1 h-full overflow-y-auto p-8 pt-20 md:pt-12 md:p-16">
        <div class="max-w-4xl mx-auto">
            <header class="mb-10 flex justify-between items-end">
                <div>
                    <span class="px-4 py-1 bg-oxford/5 text-oxford text-xs font-bold tracking-widest rounded-full uppercase">Global Rankings</span>
                    <h1 class="text-4xl font-serif font-bold text-oxford mt-4">Hall of Mastery</h1>
                    <p class="text-slate mt-2 text-lg">Compete against top scholars across the Nexal network.</p>
                </div>
            </header>

            <div class="bg-white rounded-2xl border border-slate/10 shadow-lg overflow-hidden">
                <div class="grid grid-cols-12 gap-4 p-6 bg-slate/5 border-b border-slate/10 text-xs font-bold tracking-widest uppercase text-slate/60">
                    <div class="col-span-2 text-center">Rank</div>
                    <div class="col-span-6">Scholar Alias</div>
                    <div class="col-span-4 text-right pr-4">Total Mastery XP</div>
                </div>
                
                <div id="leaderboard-container" class="divide-y divide-slate/10">
                    <div class="p-10 text-center text-slate animate-pulse font-medium">Compiling global matrix...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/uuid@8.3.2/dist/umd/uuidv4.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('leaderboard-container');
            
            async function ensureGhostsExist() {
                const { count } = await window.supabaseClient.from('profiles').select('*', { count: 'exact', head: true }).eq('is_bot', true);
                if (count < 10) {
                    const ghostNames = ["Sarah_M", "David_99", "PretoriaScholar", "MathWiz21", "Newton_Ghost", "Einstein_Jr", "AlphaCentauri", "CapeTown_Brain", "LogicGate", "Euler101"];
                    const ghostProfiles = ghostNames.map(name => ({
                        id: uuidv4(),
                        username: name,
                        xp: Math.floor(Math.random() * 8000) + 1500,
                        is_bot: true
                    }));
                    await window.supabaseClient.from('profiles').insert(ghostProfiles);
                }
            }

            async function loadLeaderboard() {
                await ensureGhostsExist();

                const { data: { user } } = await window.supabaseClient.auth.getUser();
                const { data: players } = await window.supabaseClient.from('profiles').select('*').order('xp', { ascending: false }).limit(50);

                container.innerHTML = '';

                players.forEach((player, index) => {
                    const rank = index + 1;
                    const isMe = player.id === user.id;
                    
                    let rankVisual = `<span class="text-lg font-bold text-slate/40">${rank}</span>`;
                    if (rank === 1) rankVisual = `<span class="text-xl font-black text-gold">1st</span>`;
                    if (rank === 2) rankVisual = `<span class="text-xl font-black text-silver">2nd</span>`;
                    if (rank === 3) rankVisual = `<span class="text-xl font-black text-bronze">3rd</span>`;

                    const avatarHTML = player.avatar_url 
                        ? `<img src="${player.avatar_url}" class="w-10 h-10 rounded-full object-cover">`
                        : `<div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white ${isMe ? 'bg-emerald' : 'bg-oxford/20 text-oxford'}">${player.username ? player.username.charAt(0).toUpperCase() : '?'}</div>`;

                    container.innerHTML += `
                        <div class="grid grid-cols-12 gap-4 p-6 items-center transition-all hover:bg-slate/5 ${isMe ? 'bg-emerald/5 border-l-4 border-emerald' : ''}">
                            <div class="col-span-2 text-center">${rankVisual}</div>
                            <div class="col-span-6 flex items-center space-x-4">
                                ${avatarHTML}
                                <span class="font-bold ${isMe ? 'text-emerald' : 'text-oxford'} text-lg">
                                    ${player.username || 'Anonymous'} ${isMe ? '(You)' : ''}
                                </span>
                            </div>
                            <div class="col-span-4 text-right pr-4 font-black text-emerald text-xl tracking-wide">
                                ${player.xp.toLocaleString()} XP
                            </div>
                        </div>
                    `;
                });
            }
            loadLeaderboard();
        });
    </script>
</body>
</html>
