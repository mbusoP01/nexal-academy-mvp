<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision | Nexal Pathway</title><link rel="icon" href="assets/brand/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,Arial,sans-serif;background:#f8f7f3;color:#243b53;margin:0}.wrap{max-width:1100px;margin:auto;padding:2rem 1.25rem}.card{background:#fff;border:1px solid #e5e1d8;border-radius:1rem;padding:1.25rem;box-shadow:0 10px 24px rgba(16,42,67,.05)}h1,h2{font-family:Merriweather,Georgia,serif;color:#102a43}a{color:#2e8b57;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ebe8df;padding:1rem 1.25rem}.brand{font-family:Merriweather,Georgia,serif;color:#102a43;font-size:1.2rem;font-weight:900}.muted{color:#52606d;line-height:1.6}</style></head><body><header class="top"><a class="brand" href="dashboard.html">Nexal Pathway</a><a href="dashboard.html">← Home</a></header><main class="wrap"><p style="color:#2e8b57;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem">Current-grade coursework</p><h1 id="heading">Revision</h1><p class="muted">Topic quizzes and revision assessments for your learning programme.</p><section id="items" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem"></section></main><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));document.addEventListener('DOMContentLoaded',async()=>{const q=new URLSearchParams(location.search),grade=Number(q.get('grade')||11),el=document.getElementById('items');try{const data=await fetch('content/assessments/revision-assessments.json').then(r=>r.json());const rows=(data.assessments||[]).filter(a=>Number(a.grade)===grade);document.getElementById('heading').textContent=`Grade ${grade} revision`;el.innerHTML=rows.slice(0,18).map(a=>`<article class="card"><p style="color:#2e8b57;font-size:.75rem;font-weight:700;text-transform:uppercase">${esc(a.subject)} · Term ${esc(a.term)}</p><h2 style="font-size:1.05rem">${esc(a.title)}</h2><p class="muted">${esc(a.marks||30)} marks · Nexal Academy revision assessment</p><a href="pricing.html">Open assessment →</a></article>`).join('')||'<p class="card muted">No revision assessments are available yet.</p>'}catch(e){el.innerHTML='<p class="card muted">Revision is temporarily unavailable.</p>'}});</script></body></html>
