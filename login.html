<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexal Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { oxford: '#002147', slate: '#475569', ivory: '#FDFBF7', emerald: '#2E8B57' } } } }</script>
    <style>body { background-color: #FDFBF7; background-image: linear-gradient(to right, rgba(71, 85, 105, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(71, 85, 105, 0.05) 1px, transparent 1px); background-size: 40px 40px; }</style>
</head>
<body class="font-sans text-slate antialiased min-h-screen flex flex-col">
    <nav class="w-full py-6 px-8 flex justify-between items-center bg-ivory/90 backdrop-blur-sm border-b border-slate/10 sticky top-0 z-50">
        <div class="flex flex-col"><span class="text-xs font-bold tracking-widest text-slate uppercase">Global Standard</span><a href="index.html" class="text-2xl font-serif font-black text-oxford">Nexal Academy.</a></div>
        <div class="flex items-center space-x-8">
            <a href="index.html" class="text-slate hover:text-oxford transition-colors">Home</a>
            <a href="login.html" class="text-oxford font-medium border-b-2 border-emerald">Login</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate/10 p-8 md:p-12 max-w-md w-full">
            <div class="mb-8 text-center">
                <span class="text-xs font-bold tracking-widest text-emerald uppercase mb-2 block">Secure Gateway</span>
                <h2 class="text-3xl font-serif font-bold text-oxford mb-2">Welcome back.</h2>
                <p class="text-slate/80 text-sm">Sign in to access your personalized matrix.</p>
            </div>

            <form id="email-auth-form" class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-bold tracking-widest uppercase text-slate/70 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate/5 border border-slate/20 rounded-xl px-4 py-3 text-oxford focus:border-emerald focus:outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold tracking-widest uppercase text-slate/70 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate/5 border border-slate/20 rounded-xl px-4 py-3 text-oxford focus:border-emerald focus:outline-none transition-colors">
                </div>
                
                <div class="flex flex-col space-y-3 pt-2">
                    <button type="submit" id="btn-signin" class="w-full bg-oxford text-white py-3 rounded-xl font-bold hover:bg-oxford/90 shadow-md transition-all">Sign In</button>
                    <button type="button" id="btn-signup" class="w-full bg-white text-oxford border-2 border-slate/20 py-3 rounded-xl font-bold hover:border-emerald hover:text-emerald transition-all">Create New Account</button>
                </div>
                <p id="auth-error" class="text-xs font-bold text-red-500 text-center hidden"></p>
            </form>

            <div class="flex items-center mb-6">
                <div class="flex-grow border-t border-slate/20"></div>
                <span class="px-4 text-xs font-bold text-slate/40 uppercase tracking-widest">Or</span>
                <div class="flex-grow border-t border-slate/20"></div>
            </div>

            <button id="google-signin-btn" class="w-full flex items-center justify-center space-x-3 bg-white border-2 border-slate/20 text-oxford py-3 px-4 rounded-xl font-bold hover:border-slate/40 shadow-sm transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span>Continue with Google</span>
            </button>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-logic.js"></script>
</body>
</html>
