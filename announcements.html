<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcements | Nexal Pathway</title><link rel="icon" href="assets/brand/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet"><style>body{font-family:Inter,Arial,sans-serif;background:#f8f7f3;color:#243b53;margin:0}.wrap{max-width:880px;margin:auto;padding:2rem 1.25rem}.card{background:white;border:1px solid #e5e1d8;border-radius:1rem;padding:1.25rem;box-shadow:0 10px 24px rgba(16,42,67,.05)}h1,h2{font-family:Merriweather,Georgia,serif;color:#102a43}a{color:#2e8b57;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ebe8df;padding:1rem 1.25rem}.brand{font-family:Merriweather,Georgia,serif;color:#102a43;font-size:1.2rem;font-weight:900}.muted{color:#52606d;line-height:1.6}</style></head><body><header class="top"><a class="brand" href="dashboard.html">Nexal Pathway</a><a href="dashboard.html">← My Courses</a></header><main class="wrap"><p style="color:#2e8b57;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem">Learning updates</p><h1>Announcements</h1><p class="muted">Relevant updates for your current learning programme.</p><section id="items" class="card"><p class="muted">No new announcements.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));document.addEventListener('DOMContentLoaded',async()=>{const el=document.getElementById('items');try{if(!window.supabaseClient)return;const {data,error}=await window.supabaseClient.from('announcements').select('title,body,priority,created_at').order('created_at',{ascending:false}).limit(10);if(error||!data?.length)return;el.innerHTML=data.map(a=>`<article style="border-bottom:1px solid #ebe8df;padding:0 0 1rem;margin-bottom:1rem"><p style="color:#2e8b57;font-size:.75rem;font-weight:700;text-transform:uppercase">${esc(a.priority)}</p><h2 style="font-size:1.1rem">${esc(a.title)}</h2><p class="muted">${esc(a.body)}</p></article>`).join('')}catch(e){console.warn('[Nexal] announcements unavailable',e.message)}});</script></body></html>
